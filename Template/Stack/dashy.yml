services:
  dashy:
    image: lissy93/dashy
    container_name: Dashy
    volumes:
      - /portainer/Files/AppData/Config/Dashy:/app/user-data
    ports:
      - ${PORT}:8080
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'node', '/app/services/healthcheck.js']
      interval: 1m30s
      timeout: 10s
      retries: 3
      start_period: 30s
